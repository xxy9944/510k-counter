name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:   # 允许在 GitHub 网页上手动点击运行

permissions:
  contents: write    # 允许把 APK 发布成 Release，手机直接下载

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Prepare Android project (补 Gradle 脚手架 + 写入定制清单)
        run: |
          flutter create --platforms=android .
          cp -f overlay_manifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish Release (APK 自动发布，手机直接下)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 510k记牌器 APK（最新构建）
          files: build/app/outputs/flutter-apk/app-release.apk
