name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:   # 允许在 GitHub 网页上手动点击运行

permissions:
  contents: write    # 允许把 APK 发布成 Release，手机直接下载

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      # 仓库目录名 510k-counter 不是合法的 Dart 包名（不能含连字符、不能以数字开头），
      # flutter create 会据此报错。这里把代码导出到合法命名的 kcounter 目录再构建。
      - name: Build APK
        run: |
          rm -rf /tmp/kkbuild
          mkdir -p /tmp/kkbuild/kcounter
          git archive HEAD | tar -x -C /tmp/kkbuild/kcounter
          cd /tmp/kkbuild/kcounter
          flutter create --platforms=android .
          # 把 compileSdk / targetSdk 提到 35，满足 flutter_plugin_android_lifecycle 的要求
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          t = t.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
          t = t.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
          p.write_text(t)
          print('patched build.gradle -> compileSdk/targetSdk 35')
          PY
          # 确保 runner 上装有 android-35 平台
          yes | sdkmanager "platforms;android-35" || true
          cp -f overlay_manifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      - name: Publish Release (APK 自动发布，手机直接下)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 510k记牌器 APK（最新构建）
          files: app-release.apk
